  <script>
    const questions=[
      ['emotion','今天遇到一件特别有意思的事，你第一反应通常是？','', ['马上想告诉 TA','见面时会告诉 TA','先告诉朋友，想起来再说','通常不会专门告诉 TA']],
      ['partnership','家里突然出现一件麻烦事时，你们更像是？','',['自然站到一起，商量着解决','分工处理，基本可靠','总要一个人催着另一个人','各自躲开，最后常由一个人收拾']],
      ['couple','终于有两个小时完全属于你们自己，你最真实的感受是？','',['很期待和 TA 一起做点什么','待在一起也挺舒服','各自安排会更轻松','反而不知道两个人能做什么']],

      ['child','如果一天完全不聊孩子，你们还剩下多少共同话题？','如果一天完全不聊家务、账单和工作，你们还剩下多少共同话题？',['很多，常常聊不完','还有一些','不太多','好像真的没什么']],

      ['partnership','你如何评价你们现在的家庭分工？','',['不必精确对半，但彼此都觉得公平','偶有不满，整体能协调','一个人明显承担更多','分工已经成为长期矛盾']],
      ['couple','如果突然有两天假期，而且孩子有人照顾，你会？','如果突然多出两天不用处理任何事情的假期，你会？',['第一反应就是想和 TA 单独出去','一起安排也不错','更想各自找朋友或做自己的事','完全没想过两个人单独出去']],
      ['shared','你们的社交圈和日常生活，通常是？','',['各自有空间，也有不少共同部分','知道彼此的朋友和安排','交集很少，互不打扰','像两条几乎不相交的线']],
      ['child','孩子不在身边时，你们相处的状态通常是？','没有家务和任务需要处理时，你们相处的状态通常是？',['更像回到了两个人的时候','轻松，但不一定会特别安排','各自玩手机或忙自己的','明显尴尬，甚至没什么可说']],

      ['partnership','当你特别累、暂时顾不过来时，TA会？','',['主动发现并把事情接过去','只要我开口，通常会帮忙','要反复提醒才行动','觉得那本来就是我的事']],

      ['couple','如果今天重新认识，在没有现实条件影响的情况下，你会想继续了解 TA 吗？','',['会，而且应该还是会被吸引','可能会，TA依然值得了解','不太确定','大概不会']],
      ['shared','你们在同一个空间，却各忙各的时候，那种感觉更接近？','',['安静但有连接，很自在','普通的相处状态','像合租室友，各不相干','我会刻意避开 TA']],
      ['child','如果孩子长大离开家，你想象中的你们会是？','如果未来不再有房贷、工作和家庭任务牵着你们，你想象中的你们会是？',['终于又有更多时间一起生活','还是会互相陪伴，各自也有空间','可能会越来越各过各的','我很难想象两个人还能靠什么连接']]
    ];
    const types={
      lovers:{code:'LOVR',emoji:'❤️',name:'恋人型夫妻',color:'#e76776',line:'生活把你们变成了家人，但没有拿走彼此的分享欲。',body:'你们不仅一起经营家庭，也仍然在经营彼此。你们会分享感受、主动靠近，也愿意为两个人保留空间。浪漫未必轰轰烈烈，但关系里仍然有温度和选择感。',notes:['继续保留固定的二人时间','别把默契当作理所当然','让欣赏和感谢被对方听见']},
      teammates:{code:'TEAM',emoji:'🤝',name:'最佳拍档型',color:'#5f8f89',line:'你们很会一起生活，也依然把对方当作重要的人。',body:'可靠与默契是你们关系里最强的底色。你们像队友，但“队友”不是感情退场，而是信任落到了日常。需要留意的是，效率很高的合作有时会悄悄盖过表达和浪漫。',notes:['偶尔做一件没有实际用途的事','多聊感受，少只聊安排','别让可靠成为唯一的赞美']},
      family:{code:'FAMP',emoji:'🏠',name:'家庭合伙人型',color:'#d49a54',line:'家庭运行得不错，只是属于“两个人”的部分正在变少。',body:'你们承担责任、处理任务，也许已经形成稳定分工。但关系的重心更偏向“把日子过好”，亲密和分享容易被放到最后。这不等于没有感情，更像是伴侣角色被家庭角色盖住了。',notes:['每周留出30分钟不聊任务','重新做一件恋爱时做过的事','问问 TA 最近真正累在哪里']},
      parenting:{code:'PARN',emoji:'🧸',name:'育儿合伙人型',color:'#8a77a8',line:'孩子是你们最强的连接，也可能遮住了夫妻本身。',body:'你们很可能都是负责任的父母，也在认真维持家庭。但当话题、时间和决定都围绕孩子展开，两个人之间原本的连接会越来越难被看见。问题未必是“不爱了”，而是父母身份占据了几乎全部空间。',notes:['创造一次不以孩子为主题的约会','每天分享一件自己的小事','把“我们需要什么”也放进家庭计划']},
      parallel:{code:'PARA',emoji:'↔️',name:'平行生活型',color:'#6680a4',line:'你们还在同一段关系里，但生活的交集正在变窄。',body:'各自独立未必是坏事，真正需要留意的是：你们是否已经习惯不再让对方参与自己的内心和生活。平行久了，冲突可能变少，但连接也会一起变少。',notes:['从一次完整、不被打断的聊天开始','交换彼此最近最在意的一件事','创造一个需要共同参与的小计划']},
      roommates:{code:'ROOM',emoji:'🪑',name:'搭伙过日子型',color:'#7f756f',line:'责任、习惯和现实仍在维系关系，亲密感却已经很淡。',body:'你们可能仍然履行各自的责任，但彼此越来越像住在同一屋檐下的生活搭子。这个结果不是判决，只是在提醒：关系里有些重要的需要，可能已经很久没有被看见或说出来。',notes:['先确认双方是否都愿意重新靠近','用具体感受代替指责和翻旧账','如果长期痛苦，可考虑寻求专业支持']}
    };
    const state={stage:'intro',mode:'solo',hasChildren:true,current:0,answers:Array(25).fill(0),soul:'',p1:null,p2:null};
    const app=document.getElementById('app');
    const labels4=['情感连接','二人世界','家庭合作','平行程度'];
    const talk=['最近一次你真正感到被我理解，是什么时候？','如果今晚完全不用处理任何任务，你最想和我一起做什么？','你觉得自己承担了哪些我可能没有看见的责任？','哪些独立空间让你觉得舒服，哪些时刻又会让你觉得疏远？','除去孩子和现实任务，我们还能怎样重新建立属于两个人的连接？'];
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function metric(dim){const vals=questions.flatMap((q,i)=>q[0]===dim&&state.answers[i]?[state.answers[i]]:[]);return Math.round(((vals.reduce((a,b)=>a+b,0)-vals.length)/(vals.length*3))*100)}
    function metrics(){const emotion=metric('emotion'),couple=metric('couple'),partnership=metric('partnership'),shared=metric('shared'),independent=metric('child');return{emotion,couple,partnership,parallel:100-shared,childDependency:100-independent,autonomy:independent}}
    function classify(m){if(m.emotion>=74&&m.couple>=68&&m.parallel<48)return'lovers';if(m.partnership>=76&&m.emotion>=57&&m.parallel<58)return'teammates';if(state.hasChildren&&m.childDependency>=62&&m.couple<60)return'parenting';if(m.parallel>=64&&m.emotion<58)return'parallel';if(m.emotion<42&&m.couple<42&&m.partnership<65)return'roommates';return'family'}
    function profile(){const m=metrics();return{v:1,c:state.hasChildren?1:0,t:classify(m),m:[m.emotion,m.couple,m.partnership,m.parallel,state.hasChildren?m.childDependency:m.autonomy]}}
    function encode(p){return btoa(JSON.stringify(p)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
    function decode(s){try{const n=s.replace(/-/g,'+').replace(/_/g,'/'),p=JSON.parse(atob(n.padEnd(Math.ceil(n.length/4)*4,'=')));return p&&p.v===1&&[0,1].includes(p.c)&&types[p.t]&&Array.isArray(p.m)&&p.m.length===5&&p.m.every(x=>Number.isFinite(x)&&x>=0&&x<=100)?p:null}catch{return null}}
    function link(kind,payload){return location.href.split('#')[0]+'#'+kind+'='+payload}
    function radar(values,labels,color){const c=130,r=82,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI*2/5,rr=r*v/100;return[c+Math.cos(a)*rr,c+Math.sin(a)*rr]};const poly=v=>values.map((_,i)=>pt(i,v).join(',')).join(' ');return`<svg viewBox="0 0 260 260" class="radar" role="img" aria-label="关系维度雷达图">${[25,50,75,100].map(v=>`<polygon points="${poly(v)}" fill="none" stroke="#d9d1c5"/>`).join('')}${values.map((_,i)=>`<line x1="130" y1="130" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#e3dcd1"/>`).join('')}<polygon points="${values.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="${color}35" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>${values.map((v,i)=>{const p=pt(i,v),l=pt(i,120);return`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${color}"/><text x="${l[0]}" y="${l[1]}" text-anchor="middle" dominant-baseline="middle" class="radar-label">${labels[i]}</text>`}).join('')}</svg>`}
    function intro(){const invited=!!state.p1&&!state.p2,slips=Object.values(types).map((t,i)=>`<div class="type-slip" style="--i:${i};--accent:${t.color}"><span class="type-emoji">${t.emoji}</span><span><small>${t.code}</small><b>${t.name}</b></span></div>`).join('');app.innerHTML=`<section class="intro"><div><div class="eyebrow">✦ ${invited?'TA 邀请你完成双人测试':'25道生活场景题 · 约5分钟'}</div><h1>${invited?'你眼中的我们，<br>和<span>TA</span>一样吗？':'你们是夫妻，<br>还是只是<span>搭子</span>？'}</h1><p class="lede">${invited?'请根据你自己的真实感受完成测试。答题结束后，才能同时揭晓双方结果和关系认知差异。':'爱情、责任、孩子和生活，把你们变成了哪一种关系？别急着下结论，先看看那些最普通的日常。'}</p><div class="setup">${invited?'':`<p class="setup-title">选择测试方式</p><div class="mode-options"><button class="mode-option ${state.mode==='solo'?'selected':''}" data-mode="solo"><i>♙</i><span><b>我自己测</b><small>立即查看自己的关系类型</small></span></button><button class="mode-option ${state.mode==='duo'?'selected':''}" data-mode="duo"><i>♙♙</i><span><b>邀请伴侣一起测</b><small>比较彼此眼中的这段关系</small></span></button></div>`}<p class="setup-title family-title">${invited?'已由邀请方选择':'选择更符合你们的情况'}</p><div class="family-options ${invited?'locked':''}"><label class="family-option"><input type="radio" name="family" value="yes" ${state.hasChildren?'checked':''} ${invited?'disabled':''}><span><b>我们有孩子</b><small>包含育儿关系相关场景</small></span></label><label class="family-option"><input type="radio" name="family" value="no" ${!state.hasChildren?'checked':''} ${invited?'disabled':''}><span><b>我们没有孩子</b><small>使用伴侣生活通用场景</small></span></label></div>${state.mode==='duo'&&!invited?'<p class="duo-hint">♡ 你完成后会得到一条专属邀请链接，再发给 TA 作答。</p>':''}<button class="primary start" id="start">${invited?'接受邀请，开始测试':state.mode==='duo'?'先测我的视角':'开始测试'}　→</button></div><p class="privacy">无需登录 · 不上传25道原始答案 · 邀请链接仅包含汇总结果</p></div><div class="type-stack"><div class="orbit">◎ 你们可能是……</div>${slips}</div></section>`;document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;render()});document.querySelectorAll('[name=family]').forEach(el=>el.onchange=e=>state.hasChildren=e.target.value==='yes');document.getElementById('start').onclick=()=>{state.stage='quiz';render()}}
    function quiz(){const q=questions[state.current],text=!state.hasChildren&&q[2]?q[2]:q[1],chosen=state.answers[state.current];app.innerHTML=`<section class="quiz"><div class="quiz-meta"><button class="back">← 返回</button><span>${String(state.current+1).padStart(2,'0')} / 25</span></div><div class="progress"><i style="width:${(state.current+1)/25*100}%"></i></div><div class="question-card"><div class="qno">QUESTION ${String(state.current+1).padStart(2,'0')}</div><h2>${esc(text)}</h2><div class="answers">${q[3].map((o,i)=>{const v=4-i;return`<label class="answer ${chosen===v?'selected':''}"><input type="radio" name="answer" value="${v}" ${chosen===v?'checked':''}><span>${esc(o)}</span></label>`}).join('')}</div><div class="qactions"><span>按真实情况选择，没有“正确答案”</span><button class="primary next" ${chosen?'':'disabled'}>${state.current===24?'完成答题':'下一题'}　→</button></div></div></section>`;document.querySelector('.back').onclick=()=>{if(state.current===0)state.stage='intro';else state.current--;render()};document.querySelectorAll('[name=answer]').forEach(el=>el.onchange=e=>{state.answers[state.current]=Number(e.target.value);render()});document.querySelector('.next').onclick=()=>{if(!state.answers[state.current])return;if(state.current===24)state.stage='soul';else state.current++;render()}}
    function soul(){const invited=!!state.p1&&!state.p2;app.innerHTML=`<section class="soul"><div class="soul-card"><div class="heart">♥</div><p class="eyebrow">最后一道 · 不计分</p><h2>如果没有孩子、房子、双方父母和经济上的牵绊，今天重新认识——</h2><h3>你还会选择 TA 吗？</h3><div class="soul-options">${['会','可能会','不知道','可能不会'].map(o=>`<label class="soul-option ${state.soul===o?'selected':''}"><input type="radio" name="soul" value="${o}" ${state.soul===o?'checked':''}>${o}</label>`).join('')}</div><p class="soul-note">这道题不会改变结果。它只是想让你停一下，想一想。</p><button class="primary reveal" ${state.soul?'':'disabled'}>${invited?'生成双人对比报告':'查看我的关系类型'}　✦</button></div></section>`;document.querySelectorAll('[name=soul]').forEach(el=>el.onchange=e=>{state.soul=e.target.value;render()});document.querySelector('.reveal').onclick=()=>{if(!state.soul)return;if(state.p1){state.p2=profile();state.stage='compare';history.replaceState(null,'',link('compare',encode(state.p1)+'.'+encode(state.p2)))}else state.stage='result';scrollTo({top:0,behavior:'smooth'});render()}}
    function result(){const m=metrics(),me=profile(),t=types[me.t],labels=[...labels4,state.hasChildren?'孩子依赖':'关系自主'],values=me.m;app.innerHTML=`<section class="result"><div class="result-head" style="--result:${t.color}"><div class="eyebrow">YOUR COUPLE TYPE</div><div class="result-code">${t.code}</div><div class="result-title"><span>${t.emoji}</span><h1>${t.name}</h1></div><p class="result-line">“${t.line}”</p></div><div class="result-grid"><article class="card profile"><div class="card-head"><b>关系画像</b><small>不是好坏分数，而是你们目前的关系形状</small></div>${radar(values,labels,t.color)}<div class="score-list">${labels.map((l,i)=>`<div class="score-row"><span>${l}</span><div><i style="width:${values[i]}%;background:${t.color}"></i></div><b>${values[i]}</b></div>`).join('')}</div></article><div class="story"><article class="card interpret"><p class="mini">这意味着什么</p><p>${t.body}</p></article><article class="card reflect"><p class="mini">可以试着做的三件小事</p><ol>${t.notes.map(n=>`<li><span>✓</span>${n}</li>`).join('')}</ol></article><div class="result-actions"><button class="primary copy" style="background:${t.color}">⧉　复制结果</button><button class="secondary reset">↻　重新测试</button></div></div></div>${state.mode==='duo'?`<article class="invite-card"><div class="invite-icon">♙♙</div><div class="invite-copy"><p class="mini">现在，邀请 TA 回答同一套题</p><h2>你眼中的关系，和 TA 眼中的一样吗？</h2><p>TA答完后会自动生成双方类型、五维分数差异和关系一致度。邀请链接不会包含你的25道原始答案。</p></div><button class="primary invite">⧉　生成并分享邀请链接</button></article>`:''}<div class="final-q"><small>你刚才的答案</small><p>“如果今天重新认识，你还会选择 TA 吗？”</p><strong>${state.soul}</strong></div></section>`;document.querySelector('.copy').onclick=()=>copyResult(`我的关系类型是「${t.name} · ${t.code}」\n${t.line}\n情感连接 ${m.emotion}｜二人世界 ${m.couple}｜家庭合作 ${m.partnership}｜平行程度 ${m.parallel}｜${state.hasChildren?'孩子依赖':'关系自主'} ${values[4]}`);if(document.querySelector('.invite'))document.querySelector('.invite').onclick=()=>share('我刚做完这个关系测试。想看看我们眼中的这段关系是否一样，邀请你也来测一次。',link('invite',encode(me)));document.querySelector('.reset').onclick=reset}
    function compare(){const a=state.p1,b=state.p2,ta=types[a.t],tb=types[b.t],labels=[...labels4,state.hasChildren?'孩子依赖':'关系自主'],gaps=a.m.map((v,i)=>Math.abs(v-b.m[i])),max=Math.max(...gaps),idx=gaps.indexOf(max),agree=Math.max(0,Math.round(100-gaps.reduce((x,y)=>x+y,0)/5)),insight=max<10?'你们在五个维度上的感受整体很接近。真正的默契不是答案完全相同，而是愿意继续确认彼此的真实感受。':`这是双方感受差异最大的维度，相差 ${max} 分。${a.m[idx]>b.m[idx]?'先完成的人':'后完成的人'}在这一项上的感受更强。差异不是谁对谁错，而是提醒你们：同一段关系可能正在被两个人以不同方式体验。`;app.innerHTML=`<section class="compare"><div class="compare-head"><div class="eyebrow">♡ COUPLE MATCH REPORT</div><h1>你们眼中的这段关系，<br><span>${agree}%</span> 相似</h1><p>这不是“默契分”或婚姻好坏分。它表示你们对当前关系状态的感受接近程度。</p></div><div class="type-pair">${[[a,ta,'先完成的人'],[b,tb,'后完成的人']].map(([p,t,n])=>`<article class="pair-card" style="--pair:${t.color}"><small>${n}</small><div>${t.emoji}<b>${t.code}</b></div><h2>${t.name}</h2></article>`).join('')}<div class="pair-heart">♥</div></div><article class="compare-card"><div class="card-head"><b>五维视角对比</b><small>红色：先完成的人　蓝色：后完成的人</small></div><div class="compare-rows">${labels.map((l,i)=>`<div class="compare-row"><div class="compare-label"><span>${l}</span><small>相差 ${gaps[i]} 分</small></div><div class="dual-bars"><div><i style="width:${a.m[i]}%"></i><b>${a.m[i]}</b></div><div><i style="width:${b.m[i]}%"></i><b>${b.m[i]}</b></div></div></div>`).join('')}</div></article><div class="insights"><article class="card gap-card"><p class="mini">最值得聊一聊的地方</p><h2>${labels[idx]}</h2><p>${insight}</p></article><article class="card talk-card"><p class="mini">今晚可以从这三句话开始</p><ol>${[talk[idx],talk[(idx+1)%5],'在这段关系里，你最希望我多看见你哪一部分？'].map((x,i)=>`<li><span>0${i+1}</span>${x}</li>`).join('')}</ol></article></div><div class="compare-actions"><button class="primary share-compare">⧉　把对比报告发给 TA</button><button class="secondary reset">↻　重新开始</button></div><p class="compare-privacy">报告链接只包含双方的类型与五项汇总分数，不包含25道原始答案和“最后一道”答案。</p></section>`;document.querySelector('.share-compare').onclick=()=>share('我们的双人关系对比报告已经生成，看看我们对这段关系的感受有多一致。',link('compare',encode(a)+'.'+encode(b)));document.querySelector('.reset').onclick=reset}
    function reset(){history.replaceState(null,'',location.href.split('#')[0]);Object.assign(state,{stage:'intro',mode:'solo',current:0,answers:Array(25).fill(0),soul:'',p1:null,p2:null});scrollTo({top:0,behavior:'smooth'});render()}
    function share(text,url){if(navigator.share){navigator.share({title:'我们是夫妻，还是搭子？',text,url}).catch(()=>{})}else copyResult(text+'\n'+url)}
    function copyResult(text){const done=()=>{const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done)}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();done()}}
    function render(){({intro,quiz,soul,result,compare})[state.stage]()}
    function loadLink(){const h=location.hash.slice(1);if(h.startsWith('invite=')){const p=decode(h.slice(7));if(p){Object.assign(state,{mode:'duo',p1:p,hasChildren:!!p.c,stage:'intro'})}}else if(h.startsWith('compare=')){const [x,y]=h.slice(8).split('.'),a=decode(x||''),b=decode(y||'');if(a&&b&&a.c===b.c)Object.assign(state,{mode:'duo',p1:a,p2:b,hasChildren:!!a.c,stage:'compare'})}}loadLink();render();
  </script>
</body>
